[package]
name = "babyphone_sender"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Desktop multicast babyphone sender (wire-compatible with the M5StickS3 firmware)"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
aes = "0.8"
clap = { version = "4.5", features = ["derive"] }
cpal = "0.15"
ctr = "0.9"
if-addrs = "0.13"
opus = "0.3"
socket2 = "0.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Power"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

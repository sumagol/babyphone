<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Android adaptive icon safe-zone background -->
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>

  <!-- Circuit trace pattern -->
  <g fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.35">
    <path d="M80 352 L112 352 L128 320 L160 320"/>
    <path d="M432 352 L400 352 L384 320 L352 320"/>
    <path d="M96 160 L128 160 L144 192 L176 192"/>
    <path d="M416 160 L384 160 L368 192 L336 192"/>
    <circle cx="160" cy="320" r="5" fill="#38bdf8" stroke="none"/>
    <circle cx="352" cy="320" r="5" fill="#38bdf8" stroke="none"/>
    <circle cx="176" cy="192" r="5" fill="#818cf8" stroke="none"/>
    <circle cx="336" cy="192" r="5" fill="#818cf8" stroke="none"/>
  </g>

  <!-- Multicast / signal arcs -->
  <g fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" opacity="0.9">
    <path d="M168 200 Q256 128 344 200"/>
    <path d="M188 228 Q256 168 324 228" opacity="0.7"/>
    <path d="M208 256 Q256 208 304 256" opacity="0.5"/>
  </g>

  <!-- Baby monitor / speaker body -->
  <g transform="translate(256, 288)">
    <!-- Device chassis -->
    <rect x="-84" y="-100" width="168" height="180" rx="28" fill="#334155" stroke="#475569" stroke-width="4"/>
    <!-- Antenna -->
    <line x1="0" y1="-100" x2="0" y2="-148" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <circle cx="0" cy="-156" r="8" fill="#38bdf8" filter="url(#glow)"/>

    <!-- Screen -->
    <rect x="-64" y="-72" width="128" height="96" rx="14" fill="#0f172a"/>

    <!-- Baby face (kept after removing waves) -->


    <!-- Baby face silhouette (minimal) -->
    <g fill="#e2e8f0" opacity="0.9">
      <circle cx="-18" cy="-48" r="3"/>
      <circle cx="18" cy="-48" r="3"/>
      <path d="M-8 -38 Q0 -32 8 -38" stroke="#e2e8f0" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>

    <!-- SRTP lock badge -->
    <g transform="translate(48, 52)">
      <rect x="-14" y="-16" width="28" height="24" rx="4" fill="#f59e0b"/>
      <path d="M-6 -16 L-6 -22 A6 6 0 0 1 6 -22 L6 -16" stroke="#f59e0b" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="0" cy="-6" r="2.5" fill="#0f172a"/>
    </g>

    <!-- Speaker grille / chip pins -->
    <g fill="#94a3b8">
      <circle cx="-52" cy="64" r="3"/>
      <circle cx="-26" cy="64" r="3"/>
      <circle cx="0" cy="64" r="3"/>
      <circle cx="26" cy="64" r="3"/>
      <circle cx="52" cy="64" r="3"/>
    </g>
  </g>

  <!-- ESP32-S3 nod: tiny S3 monogram -->
  <text x="256" y="448" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#94a3b8" letter-spacing="3">ESP32-S3</text>

  <!-- Foreground vignette safe edge -->
  <rect width="512" height="512" rx="104" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.06"/>
</svg>
